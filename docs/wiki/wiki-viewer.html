# Freeform area selection via bbox query + client-side point-in-polygon filter

## Context

Users wanted to draw an arbitrary freehand polygon (an L-shape, a curved area)
on the 2D selection map and generate the 3D scene from just that shape — not
just the existing click-drag rectangle.

The extraction layer (\`src/lib/overpass.ts\`) is hard-wired to **bounding boxes**:
it tiles a bbox into ~0.05° cells, queries Overpass per cell, subdivides/retries
heavy cells, dedupes by OSM id, and fails over across mirrors. Overpass does not
have a cheap "elements inside this arbitrary polygon" query comparable to bbox
tiling.

## Choice

Keep the Overpass query bbox-based. For a drawn polygon:

1. Compute the polygon's axis-aligned bounding box (\`bboxOfRing\` in
   \`src/lib/clip.ts\`).
2. Run the **existing** extraction (all tiling/failover untouched) on that bbox.
3. **Client-side filter** the returned elements, keeping any element that has at
   least one node inside the polygon (even-odd ray-casting \`pointInRing\`, exposed
   as \`elementInPolygon\`). The filter is inclusive: a building straddling the
   edge or a road crossing the area is **kept whole**, never clipped.

The selection map (\`Map.svelte\`) gains a ▢ Rectangle / ✎ Freeform mode toggle;
both emit a single \`Area\` type (\`{ type: 'bbox'; bbox }\` or
\`{ type: 'polygon'; ring }\`). The page resolves the area to a bbox for extraction
and applies the polygon filter only for \`polygon\`.

## Alternatives considered

- **Rewrite the extraction layer to query an arbitrary polygon.** Overpass has no
  bbox-equivalent for polygons; you'd approximate with many tiny bboxes or
  \`around\` filters, breaking the tiling/subdivision/retry logic that makes
  extraction robust. Rejected — far more risk for no better result.
- **Clip building/road geometry to the polygon boundary.** Produces prettier
  edges but adds real geometry work (polygon-polygon clipping per element) and
  visually slices buildings in half. Rejected — keeping whole objects is simpler
  and reads better at city-block scale.

## Rationale

The bbox pipeline is the fragile, hard-won part of the system. Reusing it means
zero extraction risk. The client-side filter is a pure function over already-
fetched data (~tens of thousands of elements), so cost is negligible relative to
the network extraction. Whole-object retention avoids geometry clipping entirely.

## Consequences

- An element is included if **any** of its nodes is inside the polygon, so a road
  that merely grazes the edge brings its whole length in. Acceptable for city-
  block selection.
- The 3D ground plane is still the polygon's bounding **rectangle**, not the
  exact polygon shape — content is clipped correctly, but the base is framed by a
  rectangle. Upgrade path (if wanted): build the ground from the polygon ring.
- \`src/lib/clip.ts\` is erasable-syntax-only so \`scripts/verify.mjs\` could import
  it directly, matching the convention of the other math modules.

## Source

- \`src/lib/clip.ts\` — \`bboxOfRing\`, \`pointInRing\`, \`elementInPolygon\`
- \`src/lib/types.ts\` — \`Area\` union type
- \`src/lib/components/Map.svelte\` — Rectangle/Freeform toggle + draw handlers
- \`src/routes/+page.svelte\` — area → bbox + polygon filter wiring

# Use stdlib node:sqlite for map persistence (not better-sqlite3)

## Context

\`mapmaker\` builds a \`SceneData\` descriptor (buildings / roads / water / green with tags + geometry) entirely client-side from Overpass and renders it in Three.js. Until this turn nothing was persisted — regenerating meant re-querying Overpass. The new inspect-and-download feature needs to (a) store the full scene with server-computed area/length measures and (b) let the user download one self-contained file per map.

## Choice

Persist each generated map to its **own SQLite file** (\`data/maps/<mapId>.sqlite\`) using the standard-library **\`node:sqlite\`** (\`DatabaseSync\`), exposed through a small REST surface under \`/api/maps\`. One map = one file = one database; schema is two tables (\`map\` meta + \`element\` rows carrying tags/geometry JSON and server-computed \`area_m2\` / \`length_m\`). See [[map-persistence-and-rest-api]].

## Alternatives considered

- **\`better-sqlite3\`** — most popular, but a native addon: \`node-gyp\` build step, per-platform prebuilt binaries, larger supply-chain surface. Overkill for write-once-read-many per-map files.
- **\`sql.js\` (WASM)** — pure JS but ships ~1 MB of SQLite WASM, is in-memory only (you serialize to disk yourself), and is slower.
- **Plain JSON files** — simplest, but no typed columns / queryability / measures, and re-reading large scenes is wasteful.

## Rationale

\`node:sqlite\` ships in Node ≥ 22.5 (unflagged on ≥ 23.4 / 24.x, and the project already targets Node 24). **Zero new runtime deps** — the only addition was \`@types/node\` (dev) because the project previously had no node-builtin types. The synchronous \`DatabaseSync\` API is fine here (single write on generate; small reads on meta/list/download). One-file-per-map keeps maps isolated, trivially deletable, and directly downloadable as \`application/vnd.sqlite3\`.

## Consequences

- Runtime requires **Node ≥ 22.5**.
- The module is **server-only** (imports \`node:sqlite\`) and lives under \`src/lib/server/\` — it must never be imported from client code.
- \`mapId\` is the sole user-controlled path segment; \`safeMapId()\` slug-validates it (\`^[a-zA-Z0-9_-]{1,80}$\`, rejects \`..\`) — this is the file-path trust boundary, path-traversal tested → 400.

# Pure Three.js 3D view (no MapLibre)

## Context

The project generates a 3D map of any user-selected area on Earth by fetching
OpenStreetMap data client-side and rendering it. Two rendering approaches were
researched before implementation (see the README "Design basis" section):

- **A. MapLibre GL / Mapbox-style 3D** — reuse a mature 3D globe engine that
  already tiles/serves vector + terrain data.
- **B. Pure Three.js** — fetch raw OSM via the Overpass API and build the scene
  by hand (extruded buildings, flat ribbons, flat polygons) on a ground plane
  sized in real metres.

## Choice

**Option B — pure Three.js.** MapLibre (via \`svelte-maplibre-gl\`) is used *only*
for the 2D area-selection map (\`src/lib/components/Map.svelte\`); the 3D render
stage (\`src/lib/components/ThreeMap.svelte\`) is pure Three.js with no MapLibre
dependency.

## Rationale

- **No data-source coupling**: pure Three.js renders only the elements the user
  selected, fetched directly from Overpass. A MapLibre 3D engine would bind the
  result to a tile/terrain provider and its coordinate system.
- **Full control over geometry**: extrusion depth, per-class road widths, flat
  water/park polygons, and the building height-ramp vertex colors are all
  hand-built — none of which a tile-consuming engine exposes cheaply.
- **Self-contained, deterministic output**: the scene is a function of the bbox
  + OSM data with no network tile fetching at render time, so it can be exported
  or inspected as plain geometry.
- **No API keys / no database**: matches the SMB-stack, key-free,
  client-side-only constraint.

## Consequences

- The math pipeline (ENU projection in \`src/lib/projection.ts\` + extrusion in
  \`src/lib/extrude.ts\`) must be implemented and kept correct — see
  [[keep-math-modules-erasable-syntax-only]] and \`npm run verify\`.
- MapLibre is deliberately excluded from the dependency optimizer in
  \`vite.config.ts\` so its v6 worker registers correctly.
- Raw OSM is classified into the \`SceneData\` descriptor in \`src/lib/osmToScene.ts\`.

## Alternatives considered

MapLibre/Mapbox GL 3D, deck.gl, Cesium — all rejected for binding output to a
tile/terrain provider and hiding the geometry the project needs to control.

# Glossary

| Term | Definition |
|------|------------|
| SMB stack | The project's web stack: SvelteKit 2 + Svelte 5 (runes) + TypeScript strict + Vite + adapter-node. No database. |
| BBox | Bounding box \`{ minLng, minLat, maxLng, maxLat }\` (\`src/lib/types.ts\`) — the user-selected area and the unit Overpass is tiled against. |
| Overpass API | A read-only API over OpenStreetMap data; queried client-side (CORS-enabled, key-free) for every element inside the bbox. |
| Overpass mirror | One public Overpass endpoint (\`overpass-api.de\`, \`kumi.systems\`, \`private.coffee\`). Each has an independent per-IP rate budget, so failover rotates across them. |
| Cell / tiling | The bbox is split into ~0.05° (~5 km) cells (capped at ≤16) so public mirrors answer fast; heavy cells are subdivided ×4 and retried. |
| OSM element | A node, way, or relation from OpenStreetMap. Ways and relations are returned by Overpass \`out geom;\` with inline geometry. |
| Multipolygon | An OSM relation with \`outer\`/\`inner\` member rings; buildings and water/parks use the largest closed outer ring plus inner rings as holes. |
| ENU projection | East-North-Up local projection: lon/lat → metres \`{ x: east, y: north }\` anchored at the bbox center. Implemented as an equirectangular approximation. |
| Equirectangular (Option B) | The chosen projection: \`xEast = (lon−lon0)·(π/180)·R·cos(lat0)\`, \`yNorth = (lat−lat0)·(π/180)·R\`. \`cos(lat)\` frozen at the anchor. |
| Shape → ExtrudeGeometry | Three.js recipe: build a \`THREE.Shape\` in local metres, extrude with \`depth = h − hMin\`, then \`rotateX(−π/2)\` so north maps to −Z and height to +Y up. |
| Winding normalization | Outer rings must be CCW and holes CW for correct normals; \`ShapeUtils.isClockWise\` flips OSM rings of unknown winding. |
| Height fallback ladder | \`height ?? 3·(building:levels ?? 1) [+ 3·roof:levels]\`, \`min_height ?? 3·building:min_level\`, clamped 0–500 m; if depth ≤ 0 the min height is dropped. |
| SceneData | The classified scene descriptor (\`src/lib/osmScene.ts\`): \`buildings\`, \`roads\`, \`flats\`, and the source \`bbox\`. What \`ThreeMap.svelte\` renders. |
| Height ramp | Building vertex-color gradient \`#aaccbb → royalblue → purple\` at 0/200/400 m, applied per-vertex on the merged building geometry. |
| Ribbon / flat geometry | Roads become flat triangulated ribbons along centerlines (width by highway class); water/green become flat \`ShapeGeometry\` polygons with holes. |
| Asymptotic progress | UI rule: the progress bar creeps toward a cap that rises with real cell progress (max 99%), never holds flat, and only reaches 100% once the scene is rendered. |
| \`npm run verify\` | A pure-Node round-trip self-check (\`scripts/verify.mjs\`) that pins projection scale, axis orientation, winding, ring cleaning, and the height ladder — catching a swapped axis that \`svelte-check\` cannot. |
| Erasable-syntax-only | Constraint on \`projection.ts\` / \`extrude.ts\` / \`osmToScene.ts\`: no enums/namespaces, so Node's type stripping can run them directly in \`verify\`. |
| base-map-gen | Sibling project (\`../base-map-gen\`) whose Overpass tiling/failover and selection-map conventions this project reuses. |

# Redeclare the discriminant field as a literal on each union variant

In \`src/lib/osmToScene.ts\`, \`BuildingPrism\` / \`RoadLine\` / \`FlatPoly\` extend \`MapObjectBase\`, whose \`kind: ObjectKind\` is the broad union \`'building' | 'road' | 'water' | 'green' | 'map'\`. **Inheriting that broad type means each subclass's \`kind\` is still the full union**, so \`SceneObject = BuildingPrism | RoadLine | FlatPoly\` is *not* a real discriminated union: a \`switch (o.kind)\` won't narrow \`o\` to the right variant, and \`o.outer\` / \`o.points\` won't type-check under the branch you expect.

## Fix

Redeclare \`kind\` as a **literal** on each variant:

- \`BuildingPrism { kind: 'building'; ... }\`
- \`RoadLine { kind: 'road'; ... }\`
- \`FlatPoly { kind: 'water' | 'green'; ... }\` (narrows \`MapObjectBase.kind\`)

Then TypeScript narrows correctly per branch.

## Why it bit us

The base interface looked "typed enough" because \`kind\` had a named union type, so the missing per-variant literal was invisible until code tried to branch on it. General TS rule, but it surfaced here on the scene-object model — the fix lives in \`src/lib/osmToScene.ts\`.

# Overview

**mapmaker** is a pure-**Three.js** 3D map generator built on the SMB stack
(SvelteKit 2 + Svelte 5 runes + TypeScript strict + Vite + adapter-node). A user
draws a box or freehand polygon on a 2D world map, every OpenStreetMap element
inside that area is fetched **client-side** from the Overpass API, and the result is rendered as a
pure Three.js 3D scene — extruded building prisms, flat road ribbons, flat
water/park polygons, and a ground plane sized in real metres. There is **no
MapLibre in the 3D view** (MapLibre via \`svelte-maplibre-gl\` is used *only* for
the 2D area-selection map). Persisted maps live as **one SQLite file per map**
(\`data/maps/<mapId>.sqlite\`, written via the stdlib \`node:sqlite\`) — there is no
shared/central database. See [[map-persistence-and-rest-api]].

## How it works (four stages)

1. **Select** — \`src/lib/components/Map.svelte\` is the only MapLibre surface: a
   CARTO Positron base style with a **▢ Rectangle / ✎ Freeform** toggle. Rectangle
   is click-drag box-draw; Freeform is click-drag to trace a freehand polygon
   (release to finish, throttled to ~3px spacing). The drawn area is emitted as an
   \`Area\` (\`src/lib/types.ts\`): \`{ type: 'bbox'; bbox }\` or
   \`{ type: 'polygon'; ring }\`. A freeform polygon is resolved at generate time by
   querying its bbox and client-side filtering — see
   [[freeform-area-selection-via-bbox-query-client-side-point-in-]].
2. **Generate** — \`src/lib/overpass.ts\` tiles the bbox into ~0.05° cells, queries
   each cell against public Overpass mirrors (CORS-enabled, key-free), subdivides
   heavy cells (406/413/504) ×4 and retries, dedupes border elements by OSM id,
   and fails over across mirrors with independent per-IP rate buckets plus a
   per-mirror \`AbortController\` timeout. \`src/routes/+page.svelte\` runs the
   extraction with an asymptotic progress bar that creeps toward 99% and only
   shows 100% when the scene is rendered.
3. **Render** — \`src/lib/osmToScene.ts\` classifies raw OSM elements into a
   \`SceneData\` descriptor (buildings with heights, roads with per-class widths,
   flat water/green polygons). \`src/lib/components/ThreeMap.svelte\` projects
   lon/lat → local metres (\`src/lib/projection.ts\`, equirectangular ENU anchored
   at the bbox center), extrudes buildings (\`src/lib/extrude.ts\`), merges one
   \`BufferGeometry\` per category (stamping a per-vertex \`objId\` so merged meshes
   stay individually clickable — see [[merged-geometry-object-identity-per-vertex-objid]]),
   paints a height-ramp vertex color on buildings, and flies an \`OrbitControls\`
   camera through 5 presets (top/iso/low/high/side, top-down default) plus
   rotate/tilt nudges (\`src/lib/view.ts\`).
4. **Persist & inspect** — on generate the scene is \`POST\`ed to
   \`POST /api/maps\`, which writes the per-map SQLite file with server-computed
   \`area_m²\` / \`length_m\` per element (\`src/lib/server/db.ts\`). Clicking any
   object raycasts back to its OSM identity and opens a slide-in
   \`src/lib/components/InfoDrawer.svelte\` (name, OSM type/id + openstreetmap.org
   link, derived stats from \`src/lib/measure.ts\`, full tag set, and the map's
   SQLite download). Endpoints: \`GET /api/maps\` (list), \`GET /api/maps/[id]\`
   (meta), \`GET /api/maps/[id]/download\` (file).

## Source layout

Application code lives in \`src/lib/\` plus the page and API routes in
\`src/routes/\`. Everything is \`strict\` TypeScript:

- **Domain modules** (\`src/lib/\`): \`projection.ts\`, \`extrude.ts\`, \`osmToScene.ts\`,
  \`overpass.ts\`, \`clip.ts\` (freeform-selection geometry: bbox-of-ring + even-odd
  point-in-polygon + keep-if-any-node-inside), \`types.ts\`, plus \`measure.ts\`
  (local-metre area/length/format helpers for the drawer) and \`view.ts\` (the
  imperative camera \`ViewController\` API). \`src/lib/server/db.ts\` is the
  **server-only** SQLite persistence module.
- **Components** (\`src/lib/components/\`): \`Map.svelte\` (2D selection),
  \`ThreeMap.svelte\` (3D viewport + picking + camera), \`InfoDrawer.svelte\`
  (inspect/download panel).
- **Routes** (\`src/routes/\`): \`+page.svelte\` (orchestrates select → generate →
  render → persist) and \`src/routes/api/maps/\` (the REST surface).

The math-heavy modules (\`projection.ts\`, \`extrude.ts\`, \`osmToScene.ts\`) are kept
**erasable-syntax-only** (no enums/namespaces) so that \`scripts/verify.mjs\`
(\`npm run verify\`) can import them directly via Node ≥ 22.18 type stripping — a
pure-Node self-check that pins the projection/extrusion orientation, which
\`svelte-check\` cannot catch. \`vite.config.ts\` excludes \`svelte-maplibre-gl\` /
\`maplibre-gl\` from the dependency optimizer so the MapLibre v6 worker registers
correctly.

## Research basis

The pipeline was researched before implementation (the research-chain markdown
files were stripped in 2026-10 once the findings were folded into the code and
README "Design basis" section). Key basis: the projection + extrusion math cheat
sheet implemented in \`projection.ts\` / \`extrude.ts\`, and the Overpass
client-side streaming gotchas implemented in \`overpass.ts\`. Conventions were
lifted from the sibling \`../base-map-gen\` project (Overpass tiling/failover and
the selection-map).

# Merged-geometry object identity (per-vertex objId)

## What is it?

A technique for keeping per-source-object identity **after** many geometries are merged into one Three.js \`BufferGeometry\` per category. Each renderable object is assigned an index into a \`pickList\`; before merging, its geometry is given a per-vertex \`objId\` \`BufferAttribute\` set to that index (every vertex of the object carries the same id). On a raycast hit, \`geometry.getAttribute('objId').array[hit.faceIndex * 3]\` resolves straight back to the source object.

## Why does it matter?

Rendering one merged geometry per category (buildings / roads / water / green) is what makes the scene cheap to draw. Naively merging throws away *which triangle belonged to which OSM object*, so click-to-inspect would be impossible. This keeps the performance of merging **and** makes every object individually selectable.

## Key rules / properties

- \`objId\` must be **uniform across all vertices of one object** — write it as a 1-component attribute with the object's index repeated for every vertex.
- The **ground plane intentionally has no \`objId\` attribute** → a raycast hit with no \`objId\` is interpreted as a "map" selection (opens the map-overview drawer).

  "pages/entities/map-persistence-and-rest-api.md": `---
type: Entity
title: Map persistence and REST API
description: Server-side subsystem that persists each generated map to its own SQLite file and exposes it over HTTP. One map = one file = one database under \`data/maps/<mapI
tags: [persistence, sqlite, api, server]
timestamp: "2026-08-12T19:00:05.467Z"
---

# Map persistence and REST API

Server-side subsystem that persists each generated map to its own SQLite file and exposes it over HTTP. One map = one file = one database under \`data/maps/<mapId>.sqlite\`. This is the project's **first persistence layer** — until this turn the app had no database.

## Role

Lets generated maps survive a page reload, be listed/inspected by metadata, and be downloaded as a self-contained \`.sqlite\`. The download carries server-computed \`area_m²\` / \`length_m\` per element so the data is useful outside the app. Built on stdlib \`node:sqlite\` (decision record "Use stdlib node:sqlite for map persistence", in \`decisions/\`).

## Details

- **Location**: \`src/lib/server/db.ts\` (storage) + \`src/routes/api/maps/+server.ts\`, \`src/routes/api/maps/[id]/+server.ts\`, \`src/routes/api/maps/[id]/download/+server.ts\` (HTTP).
- **Schema** (per file):
  - \`map\` — \`id\` PK, \`created_at\`, bbox (\`min/max_lng/lat\`), element counts (\`n_buildings/roads/water/green\`).
  - \`element\` — \`rowid\`, \`osm_type\`, \`osm_id\`, \`kind\`, \`name\`, \`height\`, \`min_height\`, \`width\`, \`area_m2\`, \`length_m\`, \`tags\` (JSON), \`geometry\` (JSON); index on \`kind\`.
- **Endpoints**:
  - \`POST /api/maps\` — write/overwrite a map (\`201\`).
  - \`GET /api/maps\` — list all maps, newest-first.
  - \`GET /api/maps/[id]\` — metadata (\`404\` if unknown).
  - \`GET /api/maps/[id]/download\` — stream the \`.sqlite\` as \`application/vnd.sqlite3\`.
- **Trust boundary**: \`mapId\` is the only user-controlled path segment; \`safeMapId()\` restricts to \`^[a-zA-Z0-9_-]{1,80}$\` and rejects \`..\` → path-traversal returns \`400\`. \`bbox\` is validated; bad JSON → \`400\`; unknown id → \`404\`.
- **Configuration**: \`MAPS_DIR = <cwd>/data/maps\` (auto-created). Requires Node ≥ 22.5 for \`node:sqlite\`.
- **Measures**: computed server-side via \`makeProjector\` anchored at the bbox centre (same ENU anchor as the 3D render) — \`area_m²\` for polygons (minus holes), \`length_m\` for polylines.

## Relationships

- [merged-geometry-object-identity-per-vertex-objid](../concepts/merged-geometry-object-identity-per-vertex-objid.md) — the client picking that feeds the same object identity.
- Reuses \`src/lib/projection.ts\` (\`makeProjector\`) for server-side measures.

## Lifecycle

- First added: this turn — introduces the project's first persistence layer (overview previously stated "no database").

# Standalone map route (/map/[mapId])

A full-viewport SSR route that renders **one persisted map** with just the 3D
viewport — no area-selection map, no generator. The URL is shareable, opens in a
new tab, and survives a refresh, because it loads straight from the map's own
SQLite file.

## Why it matters

Before this route, a generated map only existed in memory on the main page.
\`/map/[mapId]\` makes a saved map a **first-class, linkable resource**: the corner
\`↗\` link on the main page points here, and any \`/api/maps/[id]\` mapId resolves to
a real page. It shares the same camera presets and the **InfoDrawer** panel as the main
view so the map stays usable.

## Details

- **Location**:
  - \`src/routes/map/[id]/+page.server.ts\` — \`PageServerLoad\`: normalizes the id
    via \`safeMapId\`, calls \`readMapScene(id)\`, throws \`error(404, …)\` when the id
    is malformed or no map exists (handles traversal and unknown ids).
  - \`src/routes/map/[id]/+page.svelte\` — fixed full-screen layout; camera-preset
    bar + rotate/tilt nudges; \`← Back\` link to \`/\`. \`scene\` is \`$derived(data.scene)\`
    (data is reactive, so the capture must be reactive too).
- **Data source**: \`readMapScene(id)\` in \`src/lib/server/db.ts\` — the inverse of
  the write path. Reads the \`map\` row + every \`element\` row, \`JSON.parse\`s each
  row's \`tags\` / \`geometry\`, and reconstructs a full \`SceneData\` (buildings,
  roads, flats with heights/widths/holes/names). Returns \`null\` when the map
  file is absent. Uses \`readOnly\` SQLite.
- **Entry point on the main page**: \`src/routes/+page.svelte\` renders an
  \`<a class="ext" href="/map/\${scene.meta.mapId}" target="_blank" rel="noopener">↗</a>\`
  in the top-right corner of the 3D viewport.
- **Passes through**: \`selectedObj\` highlight to \`ThreeMap\` so the standalone
  page gets the same per-object selection feedback as the main page.

## Relationships

- \`[map-persistence-and-rest-api](./map-persistence-and-rest-api.md)\` — the REST surface
  (\`GET /api/maps/[id]\`, \`…/download\`) this route parallels; both read the same
  per-map SQLite files.
- **ThreeMap** (\`src/lib/components/ThreeMap.svelte\`) — the 3D component rendered full-viewport.
- **InfoDrawer** (\`src/lib/components/InfoDrawer.svelte\`) — inspect/download panel reused unchanged.

## Lifecycle

- First added: this turn, to satisfy "page with only the map in it" plus an
  external link in the corner of the main 3D view. Reconstructing \`SceneData\`
  from SQLite required the new \`readMapScene\` loader.

  "rules/highlight-picked-3d-objects-in-three-js-not-via-css.md": `---
type: Rule
title: Highlight picked 3D objects in Three.js, not via CSS
description: Guideline
tags: [three-js, webgl, selection, ui]
timestamp: "2026-08-12T19:09:15.809Z"
---

# Highlight picked 3D objects in Three.js, not via CSS

## Guideline

Per-object styling in the 3D view (selected / hovered buildings, roads, or flats)
must be done **inside Three.js** — never via CSS classes or ids on the objects.

The project's chosen implementation: rebuild a single \`THREE.LineSegments\` from
\`EdgesGeometry\` of the selected object's own geometry, drawn in a highlight
colour, on every \`selectedObj\` change. No un-merging of the merged category
meshes, no custom shaders, no separate outline pass.

## When it applies

Any time you want to visually distinguish a picked element in the 3D viewport
(\`ThreeMap.svelte\`).

## Rationale

The entire 3D scene renders into **one WebGL \`<canvas>\` DOM node**. CSS can
target the canvas itself, but has no access to individual meshes inside it —
this is a fundamental WebGL limit, not a Three.js choice, so CSS-based
"per-object selection" is impossible regardless of class/id tags.

DOM-side chrome around the viewport (toolbar, [[info-drawer]], corner links)
uses normal CSS classes as usual.

## Known ceiling

Edges-only: a filled / translucent selection tint would need depth-offset
handling to avoid z-fighting against the merged surface. Add that only if edge
highlighting proves insufficient. Marked in code as a deliberate simplification.

## Evidence

- \`src/lib/components/ThreeMap.svelte\` — \`setHighlight()\` / \`clearHighlight()\`
  rebuild the \`LineSegments\` overlay from the selected object's geometry; the
  \`HL_MAT\` constant holds the highlight material.

type: Rule
title: Keep math modules erasable-syntax-only
description: Guideline
tags: [typescript, tooling, convention]
timestamp: "2026-08-12T18:23:13.160Z"
---

# Keep math modules erasable-syntax-only

## Guideline

The math-heavy modules — \`src/lib/projection.ts\`, \`src/lib/extrude.ts\`, and
\`src/lib/osmToScene.ts\` — must stay **erasable-syntax-only**: no TypeScript
\`enum\`s, no \`namespace\`s, and nothing else that requires real type
transpilation rather than type *stripping*.

## When it applies

Any edit to those three files. Equivalent modules added later that
\`scripts/verify.mjs\` should round-trip should follow the same constraint.

## Rationale

\`npm run verify\` (\`scripts/verify.mjs\`) imports these files directly via Node
≥ 22.18 native type stripping. Node's type *stripper* can erase type
annotations, type imports, and \`as\` casts, but it **cannot** transform
\`enum\`/\`namespace\` declarations — those are real runtime constructs that need
compilation. Adding one breaks \`verify\`, which is the only check that pins
projection scale, axis orientation, winding normalization, and the height
ladder — things \`svelte-check\` cannot catch.

## How to honor it

- Prefer \`const\` unions / object maps over \`enum\`.
- Prefer module-scope functions/objects over \`namespace\`.
- If a construct requires real transpilation, move it to a *different* file and
  import the result.

## Source

- \`scripts/verify.mjs\` — the pure-Node self-check that runs these files.
- [[pure-three-js-3d-view-no-maplibre]] — why this pipeline exists at all.

  "rules/progress-bar-must-be-asymptotic-never-flat.md": `---
type: Rule
title: Progress bar must be asymptotic, never flat
description: Guideline
tags: [ux, frontend, convention]
timestamp: "2026-08-12T18:23:13.160Z"
---

# Progress bar must be asymptotic, never flat

## Guideline

The generation progress bar (\`src/routes/+page.svelte\`) must be **asymptotic**:
it creeps toward a cap that rises with real cell progress (maximum 99%), never
holds flat for long, and reaches **100% only once the scene is rendered**.

## When it applies

Any UI that reports progress for the Overpass fetch + scene-build pipeline.

## Rationale

Client-side Overpass extraction is variable-latency: cells subdivide and retry,
mirrors fail over, and rendering is a separate stage after the last cell.
A bar that fills to 100% at "fetch done" then freezes during rendering looks
broken. The asymptotic rule keeps the bar moving honestly toward the *actual*
milestone the user cares about — a visible scene — and only completes there.

## How to honor it

- Cap the bar below 100% during fetch; raise the cap as real cell progress
  increases.
- Keep the bar creeping (never constant) so the app never appears hung.
- Set 100% only after \`ThreeMap\` finishes its first render.
